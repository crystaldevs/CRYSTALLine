[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CRYSTALLine"
version = "0.2.0"
description = "A desktop GUI for building/editing CRYSTAL structures and visualising vibrational modes, built on CRYSTALClear."
readme = "README.md"
# pymatgen requires 3.11+ as of its 2025 releases, and PySide6/pyvista/ase all
# require 3.10+. Claiming anything lower doesn't fail the install - pip just
# backsolves to whatever ancient pymatgen still supports that interpreter,
# quite possibly older than the 2023.11.10 floor below, and the CIF paths then
# break at runtime instead of at install time.
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "CRYSTAL devs" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    # PySide6-Essentials, not PySide6: the latter is a metapackage for
    # Essentials + Addons, and Addons is 847 MB of Qt we never touch — WebEngine,
    # Multimedia, 3D, Charts, DataVisualization and the rest. The app imports
    # QtWidgets, QtCore, QtGui and QtSvg, and pyvistaqt adds QtOpenGL(Widgets);
    # every one of those is in Essentials, and nothing else in the tree asks for
    # the metapackage. (qtpy does try to import QtDataVisualization, but inside a
    # contextlib.suppress(ImportError) — it is an optional shim, not a
    # requirement.) Verified by running the app and the whole suite with every
    # Addons module blocked at import.
    "PySide6-Essentials>=6.5",
    "pyvista>=0.43",
    # 0.11.4 is the floor, not 0.11: Qt 6.10 broke QtInteractor on macOS —
    # the first paintEvent never returned, so the window was created but never
    # became visible — and pyvistaqt#810 (in 0.11.4) is the fix. That bug is why
    # PySide6 was capped below 6.10 until now; capping Qt was treating the
    # symptom, and it also held the app on Python <= 3.13, since PySide6 6.9.3
    # declares requires-python <3.14. Verified on 3.14 with PySide6 6.11.2 and
    # pyvistaqt 0.13.0: window visible and exposed, viewport painted, rotation
    # and resize intact, suite green.
    "pyvistaqt>=0.11.4",
    "numpy>=1.23",
    # 3.22 calls the numpy.product alias that numpy 2 removed, and declares no
    # numpy upper bound - so a resolver happily pairs it with numpy 2 and every
    # Atoms operation raises AttributeError. 3.23 dropped the alias.
    "ase>=3.23",
    # loader.py calls CifParser.parse_structures, which landed in 2023.11.10
    # (it replaced get_structures). Anything older breaks every CIF code path.
    "pymatgen>=2023.11.10",
    "CRYSTALClear>=0.2.16",
    # The four below all arrive transitively today (pymatgen pulls scipy,
    # matplotlib and spglib; pyvista pulls vtk and Pillow), but CRYSTALLine
    # imports them itself and must say so - viz/renderer.py imports scipy and
    # vtk at module level, so a resolver that ever drops one of those transitive
    # edges would break `import crystalline.viz.renderer` outright.
    "scipy>=1.9",        # cKDTree/ConvexHull (renderer, bonds), chi2 (adp)
    "vtk>=9.1",          # prop assemblies + caption actors the gizmo is built from
    "matplotlib>=3.6",   # every property plot, and the DejaVu font the labels use
    # 2.5 is where a dataset became an object with attributes. symmetry.py reads
    # its fields either way, but crystallography.py's layer-group lookup uses
    # attribute access inside a best-effort try - so on an older spglib a slab
    # would silently lose its layer group rather than fail visibly.
    "spglib>=2.5",
    "Pillow>=9.0",       # GIF and frame-sequence animation export
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt>=4"]
# Exporting a phonon animation as MP4/MOV/WebM needs an ffmpeg encoder, which
# imageio-ffmpeg ships as a binary wheel. Optional because it is a ~30 MB
# download and GIF/frame-sequence export — the default — needs nothing extra.
video = ["imageio>=2.28", "imageio-ffmpeg>=0.4"]

[project.gui-scripts]
crystalline = "crystalline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crystalline.resources" = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run the suite straight from a checkout (as the README says), no install needed.
pythonpath = ["src"]
